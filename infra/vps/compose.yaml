name: kuda-krym

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuda_krym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-kuda_krym}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *default-logging
    mem_limit: 384m
    pids_limit: 100
    shm_size: 128m
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
    logging: *default-logging
    mem_limit: 96m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ghcr.io/aleks-man/kuda-krym-migrator:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 384m
    pids_limit: 150
    restart: "no"
    security_opt:
      - no-new-privileges:true

  seed:
    image: ghcr.io/aleks-man/kuda-krym-migrator:${IMAGE_TAG:-latest}
    command: npm run seed --workspace @kuda-krym/database
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]
    logging: *default-logging
    mem_limit: 512m
    pids_limit: 150
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/aleks-man/kuda-krym-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NODE_ENV: production
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org/}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io/}
      PORT: 4000
      RATE_LIMIT_EXPENSIVE_MAX_REQUESTS: ${RATE_LIMIT_EXPENSIVE_MAX_REQUESTS:-10}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY_HOPS: 1
      WEB_ORIGIN: https://kudakrym.ru
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 384m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/aleks-man/kuda-krym-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
      SITE_URL: https://kudakrym.ru
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 512m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging
    mem_limit: 96m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  redis-data:
