name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  check:
    name: Check public website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS response
        shell: bash
        run: |
          curl \
            --fail \
            --location \
            --max-time 20 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            --output /dev/null \
            https://kudakrym.ru/
